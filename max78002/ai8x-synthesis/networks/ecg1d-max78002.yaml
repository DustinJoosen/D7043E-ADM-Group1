    kernel_size: 3

  - max_pool: 2
    pool_stride: 2
    pad: 0
    activate: ReLU
    out_offset: 0x2000
    processors: 0xffffffff
    operation: Conv1d
    kernel_size: 3

  - flatten: true
    out_offset: 0x0000
